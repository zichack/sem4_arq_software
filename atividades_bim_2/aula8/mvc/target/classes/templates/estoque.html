<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Estoque - MVC</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 900px; }
    nav a { margin-right: 16px; font-weight: bold; }
    .msg-ok { color: #155724; background: #d4edda; padding: 8px 12px; margin: 12px 0; border-radius: 4px; }
    .msg-err { color: #721c24; background: #f8d7da; padding: 8px 12px; margin: 12px 0; border-radius: 4px; }
    .forms { display: flex; gap: 24px; margin: 16px 0; }
    .box { border: 1px solid #ccc; padding: 14px; border-radius: 6px; flex: 1; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f2f2f2; }
  </style>
</head>
<body>
  <nav>
    <a th:href="@{/products}">Produtos</a>
    <a th:href="@{/estoque}">Estoque</a>
    <a th:href="@{/pedidos}">Pedidos</a>
  </nav>

  <h1>Controle de Estoque</h1>

  <div th:if="${sucesso}" class="msg-ok" th:text="${sucesso}"></div>
  <div th:if="${erro}" class="msg-err" th:text="${erro}"></div>

  <div class="forms">
    <div class="box">
      <h3>Entrada de Estoque</h3>
      <form th:action="@{/estoque/entrada}" method="post">
        <p>
          <label>Produto:
            <select name="productId" required>
              <option th:each="p : ${products}"
                      th:value="${p.id}"
                      th:text="${p.nome + ' (' + p.status + ' - qtd: ' + p.quantidadeEstoque + ')'}"></option>
            </select>
          </label>
        </p>
        <p>
          <label>Quantidade: <input type="number" name="quantidade" min="1" required></label>
        </p>
        <button type="submit">Registrar Entrada</button>
      </form>
    </div>

    <div class="box">
      <h3>Saída de Estoque</h3>
      <form th:action="@{/estoque/saida}" method="post">
        <p>
          <label>Produto:
            <select name="productId" required>
              <option th:each="p : ${products}"
                      th:value="${p.id}"
                      th:text="${p.nome + ' (' + p.status + ' - qtd: ' + p.quantidadeEstoque + ')'}"></option>
            </select>
          </label>
        </p>
        <p>
          <label>Quantidade: <input type="number" name="quantidade" min="1" required></label>
        </p>
        <button type="submit">Registrar Saída</button>
      </form>
    </div>
  </div>

  <h2>Saldo Atual dos Produtos</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Produto</th>
        <th>Quantidade</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.nome}"></td>
        <td th:text="${p.quantidadeEstoque}"></td>
        <td th:text="${p.status}"></td>
      </tr>
    </tbody>
  </table>

  <h2>Histórico de Movimentações</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Produto</th>
        <th>Tipo</th>
        <th>Quantidade</th>
        <th>Data/Hora</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="m : ${movimentacoes}">
        <td th:text="${m.id}"></td>
        <td th:text="${m.product.nome}"></td>
        <td th:text="${m.tipo}"></td>
        <td th:text="${m.quantidade}"></td>
        <td th:text="${m.dataHora}"></td>
      </tr>
    </tbody>
  </table>
</body>
</html>

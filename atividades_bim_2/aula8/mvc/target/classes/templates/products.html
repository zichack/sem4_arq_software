<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Produtos - MVC</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 900px; }
    nav a { margin-right: 16px; font-weight: bold; }
    .msg-ok { color: #155724; background: #d4edda; padding: 8px 12px; margin: 12px 0; border-radius: 4px; }
    .msg-err { color: #721c24; background: #f8d7da; padding: 8px 12px; margin: 12px 0; border-radius: 4px; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f2f2f2; }
    form.inline { display: inline-flex; gap: 6px; align-items: center; }
  </style>
</head>
<body>
  <nav>
    <a th:href="@{/products}">Produtos</a>
    <a th:href="@{/estoque}">Estoque</a>
    <a th:href="@{/pedidos}">Pedidos</a>
  </nav>

  <h1>Cadastro de Produtos</h1>

  <div th:if="${sucesso}" class="msg-ok" th:text="${sucesso}"></div>
  <div th:if="${erro}" class="msg-err" th:text="${erro}"></div>

  <form th:action="@{/products}" method="post">
    <label>Nome: <input type="text" name="nome" required></label>
    <label>Preço: <input type="number" name="preco" step="0.01" min="0.01" required></label>
    <button type="submit">Cadastrar Produto</button>
  </form>

  <h2>Produtos Cadastrados</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Preço</th>
        <th>Estoque</th>
        <th>Status</th>
        <th>Ação (ADM)</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.nome}"></td>
        <td th:text="${p.preco}"></td>
        <td th:text="${p.quantidadeEstoque}"></td>
        <td th:text="${p.status}"></td>
        <td>
          <form th:if="${p.status.name() != 'DESCONTINUADO'}"
                th:action="@{'/products/' + ${p.id} + '/descontinuar'}"
                method="post" class="inline">
            <select name="perfil">
              <option th:each="perfil : ${perfis}" th:value="${perfil}" th:text="${perfil}"></option>
            </select>
            <button type="submit">Descontinuar</button>
          </form>
          <span th:if="${p.status.name() == 'DESCONTINUADO'}">Descontinuado</span>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
